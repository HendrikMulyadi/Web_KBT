version: '3.9'
services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: php
        volumes:
            - ./src:/var/www/html
        networks:
            - app-network
    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: unless-stopped
        env_file: .env
        volumes:
            - ./mysql_data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - app-network
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        restart: always
        depends_on:
            - mysql
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - "8081:80"
        networks:
            - app-network
    nginx:
        image: nginx:latest
        container_name: nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./src:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - app-network
networks:
    app-network:
        driver: bridge
